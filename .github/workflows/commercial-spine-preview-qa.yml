name: Commercial Spine Preview QA

on:
  push:
    branches:
      - exe-20260828-007-commercial-spine-v01

permissions:
  contents: read

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_BASE: https://exe-20260828-007-commercial.afrodescendantali-site.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run served-preview browser QA
        run: |
          mkdir -p qa-artifacts/screenshots
          cat > /tmp/qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = process.env.PREVIEW_BASE;
          const routes = [
            '/',
            '/services',
            '/services/media-content-publication',
            '/services/websites-digital-presence',
            '/services/research-communications-public-affairs',
            '/services/business-knowledge-audience-systems',
            '/services/specialist-intelligence-automation',
            '/work',
            '/method',
            '/contact?type=Not%20Sure',
            '/about',
            '/analysis/'
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 }
          ];
          const expectedNav = ['Home','Services','Work','Analysis','About','Contact'];
          const commercialRoutes = new Set(routes.slice(0, 10));
          const results = [];
          let failures = 0;

          const browser = await chromium.launch({ headless: true });
          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const page = await context.newPage();
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push(String(err)));

            for (const route of routes) {
              consoleErrors.length = 0;
              const url = base + route;
              let status = null;
              let nav = [];
              let overflow = null;
              let noindex = null;
              let offerCount = null;
              let contactOptions = null;
              let mailto = null;
              let error = null;
              try {
                let response = null;
                for (let attempt = 0; attempt < 12; attempt++) {
                  response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
                  if (response && response.status() === 200) break;
                  await page.waitForTimeout(5000);
                }
                status = response ? response.status() : null;
                await page.waitForTimeout(500);
                nav = await page.locator('[data-nav-menu] a').allTextContents();
                overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
                noindex = await page.locator('meta[name="robots"]').getAttribute('content').catch(() => null);
                if (route === '/services') offerCount = await page.locator('main article').count();
                if (route.startsWith('/contact')) {
                  contactOptions = await page.locator('[data-inquiry-type] option').count();
                  mailto = await page.locator('.inquiry-mailto').getAttribute('href');
                }
                const safe = route.replace(/[/?=&%]+/g,'_').replace(/^_+|_+$/g,'') || 'home';
                await page.screenshot({ path: `qa-artifacts/screenshots/${viewport.name}-${safe}.png`, fullPage: true });
              } catch (e) {
                error = String(e);
              }

              const checks = {
                status200: status === 200,
                navExact: JSON.stringify(nav) === JSON.stringify(expectedNav),
                noHorizontalOverflow: overflow !== null && overflow <= 2,
                stagedNoindex: commercialRoutes.has(route) ? (noindex || '').toLowerCase().includes('noindex') : true,
                servicesOfferCount: route === '/services' ? offerCount === 24 : true,
                contactSixLanes: route.startsWith('/contact') ? contactOptions === 6 : true,
                contactMailto: route.startsWith('/contact') ? (mailto || '').startsWith('mailto:info@afrodescendantali.com') : true,
                noPageError: error === null,
                noConsoleError: consoleErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failures++;
              results.push({ viewport: viewport.name, route, url, status, nav, overflow, noindex, offerCount, contactOptions, mailto, consoleErrors: [...consoleErrors], error, checks, passed });
              console.log(`${passed ? 'PASS' : 'FAIL'} ${viewport.name} ${route}`, checks, error || '');
            }
            await context.close();
          }
          await browser.close();
          const summary = {
            base,
            commit: process.env.GITHUB_SHA,
            generatedAt: new Date().toISOString(),
            total: results.length,
            passed: results.filter(r => r.passed).length,
            failed: failures,
            results
          };
          fs.writeFileSync('qa-artifacts/report.json', JSON.stringify(summary, null, 2));
          fs.writeFileSync('qa-artifacts/summary.txt', `Base: ${base}\nCommit: ${process.env.GITHUB_SHA}\nChecks: ${summary.total}\nPassed: ${summary.passed}\nFailed: ${summary.failed}\n`);
          if (failures) process.exit(1);
          NODE
          node /tmp/qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-spine-preview-qa
          path: qa-artifacts/
          retention-days: 14
