name: Daily newsroom freshness

on:
  schedule:
    # 08:17 Africa/Nairobi (05:17 UTC)
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-newsroom-freshness
  cancel-in-progress: true

jobs:
  source-refresh:
    name: Read-only source refresh and public fallback check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run review-only daily refresh
        run: node scripts/daily-source-refresh.mjs --check-public

      - name: Run public content contract
        run: node scripts/qa-content-check.mjs

      - name: Upload daily freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-newsroom-freshness
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
