name: QA core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-core:
    name: Browser, content, HTML, and Lighthouse checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install QA tools
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run required checks
        shell: bash
        run: |
          set +e
          npm run test:content
          CONTENT_STATUS=$?
          npm run test:html
          HTML_STATUS=$?
          npm run test:qa
          PLAYWRIGHT_STATUS=$?
          npm run test:lhci
          LIGHTHOUSE_STATUS=$?

          printf "\nQA status: content=%s html=%s playwright=%s lighthouse=%s\n"             "$CONTENT_STATUS" "$HTML_STATUS" "$PLAYWRIGHT_STATUS" "$LIGHTHOUSE_STATUS"

          if [ "$CONTENT_STATUS" -ne 0 ] || [ "$HTML_STATUS" -ne 0 ] ||              [ "$PLAYWRIGHT_STATUS" -ne 0 ] || [ "$LIGHTHOUSE_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-core-evidence
          path: |
            qa-artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  link-scan:
    name: Link and asset integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Scan public links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './public/**/*.html' './public/**/*.xml'
          fail: true
